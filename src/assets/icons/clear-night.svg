<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title>Clear night weather</title><desc>Animated clear night icon</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42B8FF"/><stop offset="1" stop-color="#174EA6"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283593"/><stop offset="1" stop-color="#0D1B2A"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F8FCFF"/><stop offset="1" stop-color="#9CC9E8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .cloud{fill:url(#cloud);stroke:#D8F0FF;stroke-width:2;stroke-linejoin:round}
      .ray{stroke:#FFD45A;stroke-width:4;stroke-linecap:round}
      .rain{stroke:#42B8FF;stroke-width:4;stroke-linecap:round}
      .wind{fill:none;stroke:#BDEBFF;stroke-width:3;stroke-linecap:round}
      .snow{fill:#EAF8FF;stroke:#9DD9FF;stroke-width:1.5}
    </style>
  </defs>
  <circle cx="69" cy="56" r="25" fill="#FFF1B5" filter="url(#glow)"/><circle cx="80" cy="47" r="25" fill="#172B62"/><g fill="#EAF8FF"><circle cx="29" cy="30" r="2"/><circle cx="43" cy="20" r="1.5"/><circle cx="102" cy="26" r="2"/><circle cx="92" cy="72" r="1.5"/></g>
</svg>
